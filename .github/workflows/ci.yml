name: CI

on:
  push:
    branches: [main, "vibe/*"]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile check
        run: python -m py_compile $(find app -name '*.py')
      - name: Import smoke test
        env:
          DATABASE_URL: sqlite:////tmp/ci-smoke.db
          SECRET_KEY: ci-secret
        run: |
          python -c "
          import warnings; warnings.filterwarnings('ignore')
          from app.main import app
          from app.tasks.celery_app import celery_app
          from app.tasks import jobs, polling
          from app.services import snmp_service, ssh_service, tr069_service, vendor_api, discovery, provisioning
          tasks = sorted(t for t in celery_app.tasks if t.startswith('app.'))
          assert len(app.routes) > 0
          assert 'app.tasks.jobs.run_job' in tasks and 'app.tasks.polling.poll_device' in tasks
          print('backend smoke OK:', len(app.routes), 'routes,', len(tasks), 'tasks')
          "

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
